<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myconomy</title>
<meta name="description" content="Myconomy, a mushroom farming and cooking game for Android.">
<link rel="icon" href="myconomy/icon-192.png">
<style>
  :root{ --bg:#f6f1e4; --ink:#3f2a18; --muted:#6b5a47; --accent:#3f7a2c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#171d12; --ink:#efe6d2; --muted:#b9ad97; --accent:#9ccf6a; } }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main{ max-width:680px; margin:0 auto; padding:48px 16px; text-align:center }
  img{ width:128px; height:128px; border-radius:28px }
  h1{ font-size:30px; margin:16px 0 4px }
  p{ margin:0 0 10px; color:var(--muted) }
  a{ color:var(--accent) }
</style>
</head>
<body>
<main>
  <img src="myconomy/icon-192.png" alt="">
  <h1>Myconomy</h1>
  <p>A mushroom farming and cooking game for Android, by DylanD.</p>
  <p><a href="myconomy/privacy/">Privacy policy</a></p>
</main>
</body>
</html>
